name: ${COMPOSE_PROJECT_NAME:-fahrtenbuch-custom}-dev

services:
  fahrtenbuch-dev:
    build:
      context: .
      dockerfile: Dockerfile.dev
    image: ${DEV_IMAGE_NAME:-fahrtenbuch-local-dev}:latest
    container_name: ${DEV_CONTAINER_NAME:-fahrtenbuch-custom-dev}
    working_dir: /app
    restart: unless-stopped
    init: true
    ports:
      - "${DEV_BIND_ADDRESS:-0.0.0.0}:${DEV_APP_PORT:-3001}:3000"
    volumes:
      - .:/app
      - fahrtenbuch-dev-node-modules:/app/node_modules
      - ${DEV_DATA_DIR:-./data-dev}:/app/data
    environment:
      NODE_ENV: development
      NEXT_TELEMETRY_DISABLED: "1"
      DATABASE_PATH: /app/data/fahrtenbuch.db
      BACKUP_DIR: /app/data/backups
      TZ: ${TZ:-Europe/Berlin}
    stop_grace_period: 20s

volumes:
  fahrtenbuch-dev-node-modules:
